name: Update LeetCode Stats

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count solved problems
        id: count
        shell: bash
        run: |
          count=$(find . -maxdepth 1 -type d -regextype posix-extended \
            -regex './[0-9]{4}-.*' | wc -l)

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Problems solved: $count"

      - name: Update README
        env:
          COUNT: ${{ steps.count.outputs.count }}
        shell: bash
        run: |
          python3 << 'PY'
          import os
          import re

          count = int(os.environ["COUNT"])
          total = 200

          milestones = [20, 50, 75, 100, 150, 200]

          badges = []

          for milestone in milestones:
              if count >= milestone:
                  status = "Completed"
                  color = "2ea043"
              else:
                  status = "Target"
                  color = "red"

              badges.append(
                  f'<img src="https://img.shields.io/badge/'
                  f'{milestone}-{status}-{color}?style=for-the-badge" />'
              )

          replacement = f"""<!-- LEETCODE-STATS-START -->
          <p align="center">
            🚀 <b>{count} / {total} Problems Solved</b>
          </p>

          <p align="center">
            {' '.join(badges)}
          </p>
          <!-- LEETCODE-STATS-END -->"""

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- LEETCODE-STATS-START -->.*?<!-- LEETCODE-STATS-END -->"

          updated = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit updated README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes needed."
          else
            git commit -m "chore: update LeetCode progress"
            git push
          fi
